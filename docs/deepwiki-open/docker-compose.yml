# 参考模板：来自上游 AsyncFuncAI/deepwiki-open（2026-10 调研时点）。
# 实际部署请在上游仓库内直接 docker compose up，此文件仅作结构参考与字段备忘。
services:
  deepwiki:
    build:
      context: .
      dockerfile: Dockerfile        # 国内接国产 API 用 Dockerfile-litellm；全离线用 Dockerfile-ollama-local
    ports:
      - "${PORT:-8001}:${PORT:-8001}"   # API 端口
      - "3000:3000"                     # Web 端口
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8001}
      - NODE_ENV=production
      - SERVER_BASE_URL=http://localhost:${PORT:-8001}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ~/.adalflow:/root/.adalflow     # 仓库与向量数据持久化
      - ./api/logs:/app/api/logs        # 日志持久化
    mem_limit: 6g
    mem_reservation: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8001}/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
